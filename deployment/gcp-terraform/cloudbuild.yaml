# Cloud Build: one image from the commit (deployment/gcp-terraform/release.sh), from any of the
# repository's Dockerfiles, as deployment/gcp/*.cloudbuild.yaml build theirs today.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "${_DOCKERFILE}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  # A build running as its own service account logs to Cloud Logging only (no logs bucket).
  logging: CLOUD_LOGGING_ONLY
