# Backup job overlay; use only with deployment/backup.sh. Values are operator configuration.
services:
  backup:
    build: {context: .., dockerfile: deployment/backup.Dockerfile}
    profiles: [backup]
    environment:
      ALVARY_BACKUP_DATABASE_URL: postgresql://open_alvary:${POSTGRES_PASSWORD:?Set the database password}@db:5432/open_alvary
      ALVARY_BACKUP_ALERT_COMMAND: ${BACKUP_ALERT_COMMAND:-}
      # Cloudflare R2 through rclone's environment configuration; no rclone.conf is written.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:?Set https://<account-id>.r2.cloudflarestorage.com}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set the bucket-scoped R2 access key}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set the bucket-scoped R2 secret}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      GITHUB_ALERT_TOKEN: ${GITHUB_ALERT_TOKEN:-}
      GITHUB_ALERT_REPOSITORY: ${GITHUB_ALERT_REPOSITORY:-}
    volumes:
      - ${BACKUP_RECIPIENT_FILE:?Set the public OpenPGP recipient key file}:/run/keys/recipient.asc:ro
      - ./alert_github_issue.sh:/opt/open-alvary/alert_github_issue.sh:ro
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
