services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_alvary
      POSTGRES_USER: open_alvary
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - corpus_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_alvary"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://open_alvary:local-development-only@db:5432/open_alvary
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed && uvicorn api.main:app --host 0.0.0.0 --port 8018"]
    ports: ["127.0.0.1:8018:8018"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    ports: ["127.0.0.1:5178:80"]
    depends_on: [api]
volumes:
  corpus_db:
