# The pilot uses a shared API request budget across all clients behind the edge.
limit_req_zone $server_name zone=public_api:1m rate=20r/s;
limit_req_status 429;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://api:8018/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
