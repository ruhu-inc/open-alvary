name: Security scans
# MAC-13: dependency and secret scanning in continuous integration. Weekly as well, because new
# advisories appear for dependencies that have not changed.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pip-audit
      - name: Python dependencies, as pinned (service, workbench and ingestion jobs)
        run: pip-audit --strict --no-deps --disable-pip -r requirements.lock -r deployment/ingestion-jobs.requirements.lock
      - name: Website and workbench editor, what ships to browsers
        run: |
          npm --prefix web audit --omit=dev --audit-level=high
          npm --prefix workbench/editor audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets anywhere in the history (gitleaks, pinned; findings are redacted)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --exit-code 1
