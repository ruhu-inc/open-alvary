name: Verify corpus boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open_alvary
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: open_alvary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U open_alvary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && pytest -q
      - name: PostgreSQL integration contracts
        run: pytest -q -m postgres --run-postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://open_alvary:test-only@localhost:5432/open_alvary_test
      - name: Reject local-only design files in public tree
        run: |
          forbidden=$(git ls-files -- docs scripts/planning_contracts.py scripts/spec_models.py scripts/verify_spec.py tests/test_planning_execution.py tests/test_spec_contracts.py)
          if [ -n "$forbidden" ]; then
            echo "Local-only design files must not be tracked in the public tree."
            exit 1
          fi
      - run: python -m scripts.generate_schema && git diff --exit-code schema/corpus.schema.json schema/identity.schema.json schema/policy.schema.json
      - run: alembic upgrade head && python -m scripts.seed && python -m scripts.verify_database
        env:
          DATABASE_URL: postgresql+psycopg://open_alvary:test-only@localhost:5432/open_alvary_test
      - run: npm --prefix web ci && npm --prefix web run build
      - run: scripts/container_smoke.sh
